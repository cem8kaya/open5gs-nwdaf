name: 🧪 Interop / Lab Test Report
description: Report results of running open5gs-nwdaf against your Open5GS topology
title: "[Interop]: "
labels: ["interop", "community"]
body:
  - type: markdown
    attributes:
      value: |
        These reports are gold. 🥇 Whether it worked flawlessly or fell over, telling us what happened against a real topology directly improves the project — and successful reports feed the "tested on" matrix in the README.
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - "✅ Worked as expected"
        - "⚠️ Worked with issues / workarounds"
        - "❌ Did not work"
    validations:
      required: true
  - type: input
    id: open5gs-version
    attributes:
      label: Open5GS version
      placeholder: "e.g. v2.7.6"
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: Topology
      description: RAN (UERANSIM/srsRAN/physical), number of UEs, UPF count, bare-metal vs. containers, OS.
    validations:
      required: true
  - type: textarea
    id: analytics-tested
    attributes:
      label: Which analytics IDs did you exercise?
      placeholder: "NF_LOAD, ABNORMAL_BEHAVIOUR, NETWORK_PERFORMANCE ..."
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: What happened
      description: Observations, surprises, anything that needed tweaking in nwdaf.yaml. Attach logs/screenshots if useful (redact IMSI/SUPI).
    validations:
      required: true
