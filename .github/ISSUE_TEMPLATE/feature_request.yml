name: 💡 Feature Request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape the roadmap! For spec-defined features, please reference the relevant 3GPP clause so we can scope compliance correctly.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that you can't today? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? API shape, analytics ID, config knob, etc.
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Relevant 3GPP clause (if applicable)
      placeholder: "e.g. TS 23.288 §6.3 SLICE_LOAD_LEVEL"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: willing
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes, I'd like to implement it"
        - "Yes, with guidance"
        - "No, requesting only"
    validations:
      required: false
