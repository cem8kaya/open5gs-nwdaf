name: 🐛 Bug Report
description: Report a defect in open5gs-nwdaf
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill in as much as you can — reproduction details make fixes far faster.

        ⚠️ **Do not report security vulnerabilities here.** See [SECURITY.md](../../blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
      placeholder: |
        1. Build with `cmake ...`
        2. Run `./build/open5gs-nwdafd --config ...`
        3. `curl ...`
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include relevant `open5gs-nwdafd` log lines (set `log_level: debug`).
    validations:
      required: true
  - type: input
    id: nwdaf-version
    attributes:
      label: open5gs-nwdaf version / commit
      placeholder: "v1.0.0 or git SHA"
    validations:
      required: true
  - type: input
    id: open5gs-version
    attributes:
      label: Open5GS version
      placeholder: "e.g. v2.7.6"
    validations:
      required: false
  - type: dropdown
    id: topology
    attributes:
      label: Topology
      options:
        - UERANSIM
        - srsRAN
        - Physical gNB
        - Multi-UPF
        - No RAN (standalone)
        - Other
    validations:
      required: false
  - type: textarea
    id: build-config
    attributes:
      label: Build configuration
      description: Which CMake options / optional deps were enabled (TLS, MongoDB, SQLite, sd-journal)? OS and compiler version.
      placeholder: |
        Ubuntu 22.04, g++ 11.4
        cmake -DNWDAF_USE_TLS=ON -DNWDAF_USE_SD_JOURNAL=ON ...
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: Relevant nwdaf.yaml (redact secrets & IMSI/SUPI)
      render: yaml
    validations:
      required: false
