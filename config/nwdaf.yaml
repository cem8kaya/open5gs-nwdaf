nwdaf:
  # NF identity
  nf_instance_id: ""          # auto-generated UUID if empty
  plmn_mcc: "999"
  plmn_mnc: "70"
  sbi_bind_address: "127.0.0.1"
  sbi_port: 7779              # Must not conflict with Open5GS NFs (port 7777)

  # Open5GS NF service names (systemd unit suffix after 'open5gs-')
  # Adjust for your Open5GS version if needed
  nf_service_names:
    AMF:  "amfd"
    SMF:  "smfd"
    UPF:  "upfd"
    AUSF: "ausfd"
    UDM:  "udmd"
    PCF:  "pcfd"
    NRF:  "nrfd"
    UDR:  "udrd"
    BSF:  "bsfd"
    NSSF: "nssfd"

  # Data collection — UPF tunnel interfaces for throughput measurement
  # gtp5g bypasses user-space capture; read /sys/class/net directly
  throughput_interfaces:
    - "ogstun"
    - "ogstun2"
    - "ogstun3"
    - "ens4"
  throughput_history_size: 360      # 1 hour at 10s interval
  collection_interval_seconds: 10

  # AMF journald log parsing — Open5GS v2.7.6 uses "imsi-XXXXXXXXXXXXXXX"
  # Adjust supi_regex for earlier versions if needed
  amf_journal_lines: 500
  smf_journal_lines: 500
  supi_regex: "imsi-(\\d{15})"

  # MongoDB (for subscriber count via UDR/UDM)
  mongodb_uri: "mongodb://127.0.0.1:27017"
  mongodb_db:  "open5gs"

  # NRF registration + heartbeat (TS 29.510 §5.3.2.4)
  nrf_uri: "http://127.0.0.1:7777"
  nrf_register_on_startup: true
  nrf_heartbeat_interval_seconds: 60   # TS 29.510 recommends ≤ 60s; 0 = disabled

  # ML
  model_dir: "/opt/nwdaf/models"
  anomaly_contamination: 0.10       # Expected fraction of anomalies
  anomaly_min_samples: 10           # Minimum samples before Isolation Forest runs
  baseline_stddev_min_kbps: 0.5     # Below this, return BASELINE_TOO_LOW
  ewma_alpha: 0.3                   # EWMA smoothing factor (0=no adaptation, 1=instant)

  # Logging
  log_level: "info"                 # trace|debug|info|warn|error
  log_file: "/var/log/open5gs/nwdaf.log"

  # PROD-01: throughput history + subscription persistence across restarts
  # Requires libsqlite3-dev; set to "none" to disable (in-memory only, original behaviour)
  history_backend: "sqlite"         # "none" | "sqlite"
  history_db_path: "/opt/nwdaf/history.db"

  # PROD-06: SBI endpoint rate limiting (token bucket per client IP + global)
  # Set to 0 to disable the respective limit
  rate_limit_per_ip_rps: 10         # max requests/s from a single client IP
  rate_limit_global_rps: 100        # max total requests/s across all clients
